# -------- Gradle --------
# Heap mais contido e G1GC explícito para previsibilidade

org.gradle.jvmargs=-Xmx4g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
  -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./heapdump.hprof

# Controle de concorrência (comece conservador, suba se sobrar RAM)
org.gradle.parallel=true
org.gradle.workers.max=4

# Caching e configuration cache (você já usa)
org.gradle.caching=true
org.gradle.configuration-cache=true

# -------- Kotlin Compiler --------
# Heap do daemon do Kotlin equilibrado
kotlin.daemon.jvmargs=-Xmx4g
kotlin.code.style=official